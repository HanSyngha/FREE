name: free
version: '3.8'

# Proxy 설정 (ONCE와 동일 패턴)
x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,genai.samsungds.net,a2g.samsungds.net}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,genai.samsungds.net,a2g.samsungds.net}
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

services:
  # PostgreSQL - Port 15003
  free-db:
    image: postgres:15-alpine
    container_name: free-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-free}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-free_password}
      POSTGRES_DB: ${POSTGRES_DB:-free}
    volumes:
      - free-db-data:/var/lib/postgresql/data
    ports:
      - "15003:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-free} -d ${POSTGRES_DB:-free}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - free-network

  # Redis - Port 15004
  free-redis:
    image: redis:7-alpine
    container_name: free-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - free-redis-data:/data
    ports:
      - "15004:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - free-network

  # API Server - Port 15002
  free-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        <<: *proxy-env
    container_name: free-api
    restart: unless-stopped
    depends_on:
      free-db:
        condition: service_healthy
      free-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 15002
      DATABASE_URL: postgresql://${POSTGRES_USER:-free}:${POSTGRES_PASSWORD:-free_password}@free-db:5432/${POSTGRES_DB:-free}
      REDIS_URL: redis://free-redis:6379
      JWT_SECRET: ${JWT_SECRET:-free-jwt-secret-change-in-production-2024}
      DEVELOPERS: ${DEVELOPERS:-syngha.han}
      CORS_ORIGIN: https://a2g.samsungds.net:15001,http://a2g.samsungds.net:15001
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://a2g.samsungds.net:4090/v1/chat/completions}
      LLM_SERVICE_ID: ${LLM_SERVICE_ID:-free}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://a2g.samsungds.net:4090}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-free-encryption-key-change-in-production-2024}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:15002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - free-network

  # Frontend (Nginx) - Port 15001
  free-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        <<: *proxy-env
        VITE_API_URL: /api
        VITE_SSO_URL: ${VITE_SSO_URL:-https://genai.samsungds.net:36810}
        VITE_DASHBOARD_URL: ${DASHBOARD_URL:-http://a2g.samsungds.net:4090}
    container_name: free-frontend
    restart: unless-stopped
    depends_on:
      free-api:
        condition: service_healthy
    ports:
      - "15001:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - free-network

  # Worker - Port 15005
  free-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        <<: *proxy-env
    container_name: free-worker
    restart: unless-stopped
    depends_on:
      free-db:
        condition: service_healthy
      free-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-free}:${POSTGRES_PASSWORD:-free_password}@free-db:5432/${POSTGRES_DB:-free}
      REDIS_URL: redis://free-redis:6379
      LLM_PROXY_URL: ${LLM_PROXY_URL:-http://a2g.samsungds.net:4090/v1/chat/completions}
      LLM_SERVICE_ID: ${LLM_SERVICE_ID:-free}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://a2g.samsungds.net:4090}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-free-encryption-key-change-in-production-2024}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - free-network

volumes:
  free-db-data:
    driver: local
  free-redis-data:
    driver: local
  api-logs:
    driver: local

networks:
  free-network:
    driver: bridge

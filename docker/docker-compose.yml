name: free-main

services:
  # PostgreSQL Database (internal only)
  free-db:
    image: postgres:15-alpine
    container_name: free-main-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-free}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-free}
    volumes:
      - free-db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-free} -d ${POSTGRES_DB:-free}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - free-main-network

  # Redis Cache (internal only)
  free-redis:
    image: redis:7-alpine
    container_name: free-main-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - free-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - free-main-network

  # API Server (internal only, accessed via Nginx)
  free-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: free-main-api
    restart: unless-stopped
    depends_on:
      free-db:
        condition: service_healthy
      free-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-free}:${POSTGRES_PASSWORD}@free-db:5432/${POSTGRES_DB:-free}
      REDIS_URL: redis://free-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      DEVELOPERS: ${DEVELOPERS:-}
      CORS_ORIGIN: ${PUBLIC_URL}
      LLM_PROXY_URL: ${LLM_PROXY_URL}
      LLM_SERVICE_ID: ${LLM_SERVICE_ID:-free}
      DASHBOARD_URL: ${DASHBOARD_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      - api-logs:/app/logs
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - free-main-network

  # Frontend SPA (internal only, accessed via Nginx)
  free-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_DASHBOARD_URL: ${DASHBOARD_URL}
    container_name: free-main-frontend
    restart: unless-stopped
    depends_on:
      free-api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - free-main-network

  # Worker (BullMQ background job processor)
  free-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: free-main-worker
    restart: unless-stopped
    depends_on:
      free-db:
        condition: service_healthy
      free-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-free}:${POSTGRES_PASSWORD}@free-db:5432/${POSTGRES_DB:-free}
      REDIS_URL: redis://free-redis:6379
      LLM_PROXY_URL: ${LLM_PROXY_URL}
      LLM_SERVICE_ID: ${LLM_SERVICE_ID:-free}
      DASHBOARD_URL: ${DASHBOARD_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    networks:
      - free-main-network

  # Nginx Reverse Proxy (HTTPS, single entry point)
  nginx:
    image: nginx:alpine
    container_name: free-main-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ../nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ${CERTBOT_CONF_PATH:-/home/ubuntu/dashboard/certbot/conf}:/etc/letsencrypt:ro
    command: /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    ports:
      - "${PROXY_PORT:-6090}:6090"
    depends_on:
      - free-api
      - free-frontend
    networks:
      - free-main-network

volumes:
  free-db-data:
    driver: local
  free-redis-data:
    driver: local
  api-logs:
    driver: local

networks:
  free-main-network:
    driver: bridge
